name: Docker

# Builds the image and starts the whole stack (database + web app), as a team
# member hosting it locally would, then checks that the app answers.
on:
  pull_request:
    paths:
      - docker-compose.yml
      - .dockerignore
      - apps/web/Dockerfile
      - apps/web/package.json
      - apps/web/db/**
      - apps/web/scripts/**
      - package-lock.json
      - .github/workflows/docker.yml
  push:
    branches: [master]
    paths:
      - docker-compose.yml
      - .dockerignore
      - apps/web/Dockerfile
      - apps/web/package.json
      - apps/web/db/**
      - apps/web/scripts/**
      - package-lock.json
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Build and start with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ciOnlyPassword123

    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: The landing page answers
        run: curl --fail --silent --show-error --output /dev/null http://localhost:3000/

      - name: The database schema was applied
        run: docker compose exec -T db psql -U crp -d crp -tAc "SELECT to_regclass('public.users')" | grep -x users

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
