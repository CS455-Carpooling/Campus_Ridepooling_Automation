name: Temporary Prettier diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format target and print exact diff
        run: |
          npx prettier --write apps/web/test/integration/concurrency/last-seat.int.test.ts
          git diff -- apps/web/test/integration/concurrency/last-seat.int.test.ts
          echo '--- FORMATTED FILE START ---'
          cat apps/web/test/integration/concurrency/last-seat.int.test.ts
          echo '--- FORMATTED FILE END ---'
