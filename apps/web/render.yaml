databases:
  - name: crp-db
    databaseName: crp
    plan: free

services:
  - type: web
    name: campus-ride-pooling
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: crp-db
          property: connectionString
      - key: APP_URL
        sync: false        # e.g. https://campus-ride-pooling.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false        # e.g. "Campus Ride Pooling <noreply@yourdomain.com>"
