# Runs the whole app on one machine: PostgreSQL and the production web app.
#
#   1. Copy .env.example to .env (next to this file) and set POSTGRES_PASSWORD.
#   2. docker compose up -d --build
#   3. Open http://localhost:3000
#
# Stop with `docker compose down`; add -v to also delete the database.
name: campus-ride-pooling

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crp
      POSTGRES_USER: crp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    # Reachable from this machine only, for `npm run dev` (see apps/web/setup.md).
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crp -d crp']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crp:${POSTGRES_PASSWORD}@db:5432/crp
      APP_URL: ${APP_URL:-http://localhost:3000}
      MAIL_SCRIPT_URL: ${MAIL_SCRIPT_URL:-}
      MAIL_SCRIPT_SECRET: ${MAIL_SCRIPT_SECRET:-}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
